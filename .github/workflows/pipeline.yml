---
name: pipeline
on:
  push:
    branches:
      - pipelines
jobs:
  sonarcloud-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 19
      - name: Install SonarScanner
        run: npm install -g sonarqube-scanner
      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=rolandobracho_laboratorio-final \
            -Dsonar.organization=rolandobracho \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.javascript.node.version=19 \
            -Dsonar.sources=src \
            -Dsonar.projectName="laboratorio-final" \
            -Dsonar.projectVersion=1.0
      - name: Check SonarCloud Vulnerabilities
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          response=$(curl -s -X GET -u "$SONAR_TOKEN:"
          "https://sonarcloud.io/api/issues/search?branch=main&componentKeys=rolandobracho_laboratorio-final&facets=severities")

          echo "Respuesta completa de la API:"

          echo "$response" | jq .

          count=$(curl -s -X GET -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?branch=main&componentKeys=rolandobracho_laboratorio-final&facets=severities" | 
                  jq -r '[.facets[0].values[] | select(.val == "CRITICAL" or .val == "HIGH" or .val == "MEDIUM") | .count] | add // 0')
          if [ "$count" -gt 0 ]; then
            echo "Vulnerabilidades encontradas (Critical/High/Medium): $count"
            exit 1
          else
            echo "No hay vulnerabilidades graves. Continuando..."
          fi
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 19
      - name: Install OWASP Dependency-Check
        run: >
          sudo apt-get update

          sudo apt-get install -y wget unzip

          wget https://github.com/jeremylong/DependencyCheck/releases/download/v8.3.1/dependency-check-8.3.1-release.zip

          unzip dependency-check-8.3.1-release.zip

          echo "$PWD/dependency-check/bin" >> $GITHUB_PATH
      - name: Run Dependency-Check
        run: |
          dependency-check.sh \
            --project "Laboratorio Final" \
            --scan ./node_modules \
            --out ./reports \
            --format JSON \
            --failOnCVSS 7
      - name: Check for Critical/High/Medium Vulnerabilities
        if: always()
        run: >
          HIGH_VULNS=$(jq -r '.dependencies[] | select(.vulnerabilities[]?.severity
          == "HIGH" or .vulnerabilities[]?.severity == "CRITICAL") | .fileName'
          ./reports/dependency-check-report.json | wc -l)


          if [ "$HIGH_VULNS" -gt 0 ]; then
            echo "Vulnerabilidades CRITICAL/HIGH encontradas: $HIGH_VULNS"
            jq '.dependencies[] | select(.vulnerabilities[]?.severity == "HIGH" or .vulnerabilities[]?.severity == "CRITICAL") | {package: .fileName, vulnerabilities: .vulnerabilities}' ./reports/dependency-check-report.json
            exit 1
          else
            echo "No hay vulnerabilidades CRITICAL/HIGH en dependencias"
          fi
